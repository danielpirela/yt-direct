name: Build

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'pnpm' }
      - run: pnpm install
      - run: bash prebuild.sh mac
      - run: pnpm build:mac
      - uses: actions/upload-artifact@v4
        with: { name: mac-dmg, path: dist/*.dmg }

  win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'pnpm' }
      - run: pnpm install
      - run: bash prebuild.sh win
        shell: bash
      - run: pnpm build:win
      - uses: actions/upload-artifact@v4
        with: { name: win-exe, path: dist/*.exe }
